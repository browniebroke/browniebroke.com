name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    uses: browniebroke/github-actions/.github/workflows/ts-lint.yml@8fb2a2c1a48f4a3d627edcfe4355c734cee9f0c1 # v2.0.0

  deploy:
    uses: browniebroke/github-actions/.github/workflows/netlify-deploy.yml@8f15f824db9f3acbcf0edf9c6112a86f5e244665 # v1.28.1
    with:
      netlify_site_id: "2d3f146f-3ca0-4651-afa1-4fe16612de76"
      publish_dir: "dist"
    secrets:
      netlify_auth_token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
